name: Test HiringCafe Boolean Search

on:
  workflow_dispatch:

jobs:
  test-boolean:
    runs-on: ubuntu-latest

    steps:
      - name: Compare Product Researcher queries
        run: |
          python - <<'PY'
          import json
          import urllib.request

          endpoint = "https://hiringcafe.com/api/mcp"

          searches = [
              "Product Researcher",
              '"Product Researcher"',
              '"Product Researcher" NOT Security NOT Robotics NOT Scientist',
              '"Design Researcher"',
              '"Design Researcher" NOT Designer'
          ]

          def run_search(term, request_id):
              payload = {
                  "jsonrpc": "2.0",
                  "id": request_id,
                  "method": "tools/call",
                  "params": {
                      "name": "search_jobs",
                      "arguments": {
                          "search": term,
                          "location": "United States",
                          "posted_within_days": 7,
                          "limit": 25
                      }
                  }
              }

              req = urllib.request.Request(
                  endpoint,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Content-Type": "application/json",
                      "Accept": "application/json, text/event-stream"
                  },
                  method="POST"
              )

              with urllib.request.urlopen(req, timeout=45) as r:
                  return json.loads(r.read().decode("utf-8"))

          for i, term in enumerate(searches, 1):
              print("\n" + "=" * 70)
              print("QUERY:", term)
              print("=" * 70)

              try:
                  result = run_search(term, i)

                  for item in result.get("result", {}).get("content", []):
                      if item.get("type") == "text":
                          print(item.get("text", ""))

              except Exception as e:
                  print("ERROR:", e)

          PY
