name: Test HiringCafe UXR Search

on:
  workflow_dispatch:

jobs:
  test-mcp:
    runs-on: ubuntu-latest

    steps:
      - name: Search HiringCafe for UX research
        run: |
          curl -s -X POST https://hiringcafe.com/api/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{
              "jsonrpc": "2.0",
              "id": 1,
              "method": "tools/call",
              "params": {
                "name": "search_jobs",
                "arguments": {
                  "search": "UX Research",
                  "location": "United States",
                  "posted_within_days": 7,
                  "limit": 25
                }
              }
            }' | python -m json.tool
