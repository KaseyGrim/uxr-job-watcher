name: UXR Job Watcher

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

jobs:
  check-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check HiringCafe
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python watch_jobs.py

      - name: Save job history
        run: |
          git config user.name "UXR Job Watcher"
          git config user.email "actions@users.noreply.github.com"

          if [ -f seen_jobs.json ]; then
            git add seen_jobs.json

            if ! git diff --cached --quiet; then
              git commit -m "Update seen UXR jobs"
              git push
            fi
          fi
