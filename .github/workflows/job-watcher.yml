name: UXR Job Watcher

on:
  workflow_dispatch:

  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

jobs:
  check-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Check HiringCafe
        env:
          HIRINGCAFE_URL: ${{ secrets.HIRINGCAFE_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python watch_jobs.py

      - name: Save job history
        run: |
          git config user.name "UXR Job Watcher"
          git config user.email "actions@users.noreply.github.com"
          git add seen_jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "Update seen jobs"
            git push
          fi
