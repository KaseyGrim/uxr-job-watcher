name: Test Phone Notification

on:
  workflow_dispatch:

jobs:
  test-notification:
    runs-on: ubuntu-latest

    steps:
      - name: Send ntfy test
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -X POST \
            -H "Title: UXR Job Watcher Test" \
            -H "Priority: high" \
            -H "Tags: mag,briefcase" \
            -d "Success! Your UXR job alerts are connected." \
            "https://ntfy.sh/$NTFY_TOPIC"
